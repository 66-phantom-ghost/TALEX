    <style>
        /* Defined Colors */

<body class="bg-gray-50">

            <h1 class="text-8xl sm:text-9xl font-black mb-6 leading-none" style="color: #005F73;">

            </h1>

            </p>

            >

            </button>

            <div class="mt-8 text-gray-600 text-sm">

            </div>
        </div>
    </div>
